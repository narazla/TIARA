version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: tiara_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tiara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiara_password}
      POSTGRES_DB: ${POSTGRES_DB:-tiara_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tiara}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiara_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tiara}:${POSTGRES_PASSWORD:-tiara_password}@postgres:5432/${POSTGRES_DB:-tiara_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      MEDIA_STORAGE_PATH: /app/media_storage
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-base}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - media_storage:/app/media_storage
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m app.scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tiara_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://localhost:8000}/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_storage:
